# ===================================================================
# GCP Production Configuration Profile (`prod` / `sit`)
# ===================================================================

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 120000        # Retire connections before serverless idle timeout (~5 min)
      keepalive-time: 60000      # Ping idle connections every 60s
      connection-timeout: 10000  # Fail fast within 10s if pool is exhausted
      idle-timeout: 60000        # Return idle connections after 60s
      minimum-idle: 1            # Maintain 1 warm connection
      maximum-pool-size: 20       # Scale up to 20 connections under concurrent load
      connection-test-query: SELECT 1
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:}
          jwk-set-uri: ${OIDC_JWK_SET_URI:}

# Google Cloud & BigQuery Production Tuning
gcp:
  project-id: ${GCP_PROJECT_ID}

bigquery:
  dataset: ${BIGQUERY_DATASET:analytics}
  max-bytes-billed: ${BIGQUERY_MAX_BYTES_BILLED:1073741824} # Default 1 GB cap

security:
  admin:
    username: ${SECURITY_ADMIN_USERNAME}
    password: ${SECURITY_ADMIN_PASSWORD}
    role: ${SECURITY_ADMIN_ROLE:USER}
  jwt:
    allow-mock-fallback: ${SECURITY_ALLOW_MOCK_JWT:false}

logging:
  level:
    com.db.reporting: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
