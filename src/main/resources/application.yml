# ===================================================================
# Primary Spring Boot Application Configuration (`application.yml`)
# ===================================================================

server:
  port: ${PORT:8101}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 120000
      keepalive-time: 60000
      connection-timeout: 10000
      idle-timeout: 60000
      minimum-idle: 1
      maximum-pool-size: 20
      connection-test-query: SELECT 1
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  reporting:
    jdbc:
      query-timeout-seconds: 120

# Application Database Schemas & Default Dataset Configuration
app:
  db:
    catalog-schema: ${DB_CATALOG_SCHEMA:catalog_owner}
    report-builder-schema: ${DB_REPORT_BUILDER_SCHEMA:report_builder_owner}
    analytics-schema: ${DB_ANALYTICS_SCHEMA:${BIGQUERY_DATASET:analytics}}
    date-table: ${DB_DATE_TABLE:dim_date}
    date-column: ${DB_DATE_COLUMN:date_key}

# Google BigQuery Configuration
gcp:
  project-id: ${GCP_PROJECT_ID:}

bigquery:
  dataset: ${BIGQUERY_DATASET:analytics}
  max-bytes-billed: ${BIGQUERY_MAX_BYTES_BILLED:1073741824}

# Security Properties
security:
  admin:
    username: ${SECURITY_ADMIN_USERNAME:admin}
    password: ${SECURITY_ADMIN_PASSWORD:password}
    role: ${SECURITY_ADMIN_ROLE:USER}
  jwt:
    allow-mock-fallback: ${SECURITY_ALLOW_MOCK_JWT:true}

# Spring Boot Actuator — Health and Readiness Probes
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    db:
      enabled: false

# Logging Configuration
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId:-no-corr-id}] %-5level %logger{36} - %msg%n"
  level:
    com.reporting: DEBUG
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
